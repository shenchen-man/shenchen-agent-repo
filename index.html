<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欢迎页面</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f4f9ff 0%, #fff8f2 100%);
      color: #1f2937;
    }

    .card {
      width: min(92vw, 560px);
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 28px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.2;
    }

    .time {
      margin: 0 0 22px;
      font-size: 18px;
      color: #4b5563;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1 1 240px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      cursor: pointer;
    }

    .save-btn {
      background: #2563eb;
      color: #fff;
    }

    .reset-btn {
      background: #e5e7eb;
      color: #111827;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="welcomeText"></h1>
    <p class="time">当前时间：<span id="timeText"></span></p>

    <form id="welcomeForm">
      <input id="welcomeInput" type="text" maxlength="40" placeholder="请输入欢迎语">
      <button class="save-btn" type="submit">保存欢迎语</button>
      <button class="reset-btn" id="resetBtn" type="button">恢复默认</button>
    </form>
  </main>

  <script>
    const DEFAULT_WELCOME = "欢迎爸爸";
    const STORAGE_KEY = "welcomeMessage";

    const welcomeTextEl = document.getElementById("welcomeText");
    const timeTextEl = document.getElementById("timeText");
    const welcomeInputEl = document.getElementById("welcomeInput");
    const welcomeFormEl = document.getElementById("welcomeForm");
    const resetBtnEl = document.getElementById("resetBtn");

    function getSavedWelcome() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved && saved.trim() ? saved.trim() : DEFAULT_WELCOME;
    }

    function updateWelcome(message) {
      welcomeTextEl.textContent = message;
      welcomeInputEl.value = message;
    }

    function formatNow() {
      return new Date().toLocaleString("zh-CN", {
        hour12: false
      });
    }

    function updateTime() {
      timeTextEl.textContent = formatNow();
    }

    welcomeFormEl.addEventListener("submit", (event) => {
      event.preventDefault();
      const newMessage = welcomeInputEl.value.trim() || DEFAULT_WELCOME;
      localStorage.setItem(STORAGE_KEY, newMessage);
      updateWelcome(newMessage);
    });

    resetBtnEl.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      updateWelcome(DEFAULT_WELCOME);
    });

    updateWelcome(getSavedWelcome());
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
