<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>欢迎页面</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
      }
      .card {
        width: min(90vw, 560px);
        padding: 2rem;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        color: #f8fafc;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.6rem, 3vw, 2.2rem);
      }
      .time {
        font-size: clamp(1.2rem, 2.3vw, 1.5rem);
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="welcome-text">加载中...</h1>
      <p class="time">当前时间：<span id="current-time"></span></p>
    </main>

    <script>
      const welcomeTextElement = document.getElementById("welcome-text");
      const currentTimeElement = document.getElementById("current-time");

      function renderCurrentTime() {
        currentTimeElement.textContent = new Date().toLocaleString("zh-CN", {
          hour12: false
        });
      }

      async function loadWelcomeText() {
        try {
          const response = await fetch("/api/config");
          if (!response.ok) throw new Error("Failed to fetch config");
          const data = await response.json();
          welcomeTextElement.textContent = data.welcomeText || "欢迎爸爸";
        } catch (error) {
          welcomeTextElement.textContent = "欢迎爸爸";
        }
      }

      renderCurrentTime();
      setInterval(renderCurrentTime, 1000);
      loadWelcomeText();
    </script>
  </body>
</html>
